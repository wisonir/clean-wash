<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Clean Wash | POS Kasir & Manajemen Laundry</title>

  <!-- Favicon Laundry (Washing Machine SVG) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230284c7'%3E%3Crect x='3' y='2' width='18' height='20' rx='3' fill='%230284c7'/%3E%3Ccircle cx='12' cy='13' r='5.5' fill='%23ffffff'/%3E%3Ccircle cx='12' cy='13' r='4' fill='%2338bdf8'/%3E%3Ccircle cx='7' cy='5.5' r='1' fill='%23ffffff'/%3E%3Ccircle cx='10' cy='5.5' r='1' fill='%23ffffff'/%3E%3Cpath d='M14 5.5h4' stroke='%23ffffff' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E">
  
  <!-- Favicon & Fonts tetap sama -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
    }

    html, body { 
      background: radial-gradient(circle at 50% 30%, #0369a1 0%, #0c4a6e 55%, #082f49 100%);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      width: 100%;
      height: 100%;
      height: -webkit-fill-available;
      height: 100dvh;
      position: fixed; /* Mencegah layar wrapper ikut tergulir di mobile */
      inset: 0;
    }

    /* Container Layar Splash */
    .splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s;
    }

    .brand-icon-wrapper {
      position: relative;
      width: 84px;
      height: 84px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4);
      margin-bottom: 1.25rem;
    }

    .brand-icon-wrapper svg {
      width: 44px;
      height: 44px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .splash-title {
      color: #ffffff;
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      text-align: center;
    }

    .splash-title span { color: #38bdf8; }

    .splash-sub {
      color: #bae6fd;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 0.3rem;
    }

    .loader-container {
      margin-top: 1.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-status {
      font-size: 0.75rem;
      color: #e0f2fe;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* IFRAME FULLSCREEN PRESISI UNTUK MOBILE */
    #appFrame {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      outline: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- Layar Splash Screen -->
  <div class="splash" id="splash">
    <div class="brand-icon-wrapper">
      <svg viewBox="0 0 24 24">
        <rect x="4" y="2" width="16" height="20" rx="3" />
        <circle cx="12" cy="13" r="5" />
        <path d="M12 11a2 2 0 0 1 2 2" stroke-width="1.8" />
        <circle cx="8" cy="6" r="1" fill="#ffffff" stroke="none" />
        <line x1="12" y1="6" x2="16" y2="6" stroke-width="1.5" />
      </svg>
    </div>
    <h1 class="splash-title">Clean <span>Wash</span></h1>
    <p class="splash-sub">Owner & POS Kasir Management</p>
    <div class="loader-container">
      <div class="spinner"></div>
      <span class="loading-status">Memuat Portal...</span>
    </div>
  </div>

  <!-- Google Apps Script Iframe -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbwuQz3BMVbKuf5Z3NJtXH8AWMc8b9MLnQRhT97dhLNowA3y9C7UwVRhu2J1lMqzGlZ9OA/exec"
    allow="geolocation; camera"
    allowfullscreen
    onload="frameLoaded()">
  </iframe>

  <script>
    function frameLoaded() {
      const splash = document.getElementById("splash");
      const appFrame = document.getElementById("appFrame");
      splash.style.opacity = "0";
      setTimeout(() => {
        splash.style.display = "none";
        appFrame.style.display = "block";
      }, 500);
    }
  </script>
</body>
</html>
