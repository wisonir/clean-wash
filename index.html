<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clean Wash | POS Kasir & Manajemen Laundry</title>

  <!-- Favicon Laundry (Washing Machine SVG) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230284c7'%3E%3Crect x='3' y='2' width='18' height='20' rx='3' fill='%230284c7'/%3E%3Ccircle cx='12' cy='13' r='5.5' fill='%23ffffff'/%3E%3Ccircle cx='12' cy='13' r='4' fill='%2338bdf8'/%3E%3Ccircle cx='7' cy='5.5' r='1' fill='%23ffffff'/%3E%3Ccircle cx='10' cy='5.5' r='1' fill='%23ffffff'/%3E%3Cpath d='M14 5.5h4' stroke='%23ffffff' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E">
  
  <!-- Google Font & Favicon -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    body { 
      background: radial-gradient(circle at 50% 30%, #0369a1 0%, #0c4a6e 55%, #082f49 100%);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* Container Layar Splash */
    .splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
    }

    /* Logo Badge Berkah Laundry */
    .brand-icon-wrapper {
      position: relative;
      width: 90px;
      height: 90px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5),
                  0 0 30px rgba(2, 132, 199, 0.45);
      margin-bottom: 1.5rem;
      animation: float 3s ease-in-out infinite;
    }

    .brand-icon-wrapper svg {
      width: 48px;
      height: 48px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.25));
    }

    /* Teks Judul & Subtitle */
    .splash-title {
      color: #ffffff;
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
      line-height: 1.2;
    }

    .splash-title span {
      color: #38bdf8;
    }

    .splash-sub {
      color: #bae6fd;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 0.4rem;
      opacity: 0.95;
    }

    /* Progress Loader Modern */
    .loader-container {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 3.5px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-right-color: #0284c7;
      border-radius: 50%;
      animation: spin 0.85s cubic-bezier(0.55, 0.25, 0.25, 0.7) infinite;
    }

    .loading-status {
      font-size: 0.8rem;
      color: #e0f2fe;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Animasi */
    @keyframes spin { 
      to { transform: rotate(360deg); } 
    }

    @keyframes float { 
      0%, 100% { transform: translateY(0px); } 
      50% { transform: translateY(-6px); } 
    }

    /* Tampilan Iframe */
    iframe {
      display: none;
      width: 100vw;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Layar Splash Screen -->
  <div class="splash" id="splash">
    <!-- Ikon Mesin Cuci Laundry -->
    <div class="brand-icon-wrapper">
      <svg viewBox="0 0 24 24">
        <!-- Rangkaian Mesin Cuci -->
        <rect x="4" y="2" width="16" height="20" rx="3" />
        <!-- Pintu Drum Melingkar -->
        <circle cx="12" cy="13" r="5" />
        <!-- Efek Putaran Air / Drum -->
        <path d="M12 11a2 2 0 0 1 2 2" stroke-width="1.8" />
        <!-- Tombol Panel Atas -->
        <circle cx="8" cy="6" r="1" fill="#ffffff" stroke="none" />
        <line x1="12" y1="6" x2="16" y2="6" stroke-width="1.5" />
      </svg>
    </div>

    <!-- Teks Branding -->
    <h1 class="splash-title">Clean <span>Wash</span></h1>
    <p class="splash-sub">Owner & POS Kasir Management</p>

    <!-- Loading Indicator -->
    <div class="loader-container">
      <div class="spinner"></div>
      <span class="loading-status">Memuat Portal...</span>
    </div>
  </div>

  <!-- Google Apps Script / App Iframe -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbwuQz3BMVbKuf5Z3NJtXH8AWMc8b9MLnQRhT97dhLNowA3y9C7UwVRhu2J1lMqzGlZ9OA/exec"
    allowfullscreen
    onload="frameLoaded()">
  </iframe>

  <script>
    function frameLoaded() {
      const splash = document.getElementById("splash");
      const appFrame = document.getElementById("appFrame");
      
      // Animasi Fade Out Halus
      splash.style.opacity = "0";
      setTimeout(() => {
        splash.style.display = "none";
        appFrame.style.display = "block";
      }, 600);
    }
  </script>

</body>
</html>
